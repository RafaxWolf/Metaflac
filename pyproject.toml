[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "metaflac"
version = "0.1.0"
requires-python = ">=3.13"
description = "A FLAC metadata editor with UI written in Python."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "RafaxWolf" }
]
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=7.0",
    "ruff>=0.14",
    "pillow>=10.0",
]

[project.scripts]
metaflac = "metaflac:main"

[tool.pytest.ini_options]
addopts = "--cov=metaflac"
pythonpath = ["src"]
testpaths = ["tests"]